<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>음악 놀이터</title>
<meta name="description" content="초등 음악 개념을 듣고, 두드리고, 바꿔 보며 배우는 놀이 앱">
<link rel="stylesheet" href="app/css/app.css">
<link rel="stylesheet" href="app/css/measure.css">
<link rel="stylesheet" href="app/css/play.css">
<link rel="stylesheet" href="app/css/room.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" media="print" onload="this.media='all'">
<!-- 악보 글자(높은음자리표 · 쉼표 · 음표)만 받는 Noto Music — OFL 1.1 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&text=%F0%9D%84%9E%F0%9D%84%A2%F0%9D%84%BD%F0%9D%84%BE%F0%9D%84%BF%F0%9D%85%9D%F0%9D%85%9E%E2%99%A9%E2%99%AA&display=block">
</head>
<body>
<header class="bar">
  <div class="bar-l">
    <button id="back" class="icon-btn" type="button" aria-label="뒤로" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <a class="title" id="title" href="#/">음악 놀이터</a>
  </div>
  <div class="bar-mid" id="barMid"></div>
  <div class="bar-r" id="barR"></div>
</header>
<main id="main" tabindex="-1"></main>
<noscript>이 앱은 자바스크립트가 켜져 있어야 해요.</noscript>
<script type="module">
// 버전이 바뀌었으면 앱 파일을 모두 새로 받아 둔 뒤 시작(옛 파일과 새 파일이 섞이지 않게) — tools/ver.mjs
let cur = null; try { cur = localStorage.getItem('mn.ver'); } catch { /* */ }
try {
  const V = await (await fetch('version.json', { cache: 'no-store' })).json();
  if (V.v !== cur) { await Promise.all(V.files.map((f) => fetch(f, { cache: 'reload' }).catch(() => null))); try { localStorage.setItem('mn.ver', V.v); } catch { /* */ } }
} catch { /* 버전 파일을 못 읽으면 그냥 시작 */ }
import('./app/js/main.js');
</script>
</body>
</html>
